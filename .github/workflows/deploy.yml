name: Deploy (Cloudflare Pages)
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - site: root
            project: nk-landing
          - site: 3dtisk
            project: nk-3dtisk
          - site: voziky
            project: nk-voziky
          - site: zkusebny
            project: nk-zkusebny
    concurrency: deploy-${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nk/${{ matrix.site }} build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          command: pages deploy sites/${{ matrix.site }}/dist --project-name=${{ matrix.project }}
env:
  CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
