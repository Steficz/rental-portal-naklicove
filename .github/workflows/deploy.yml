name: Deploy (Cloudflare Pages)
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: root
            project: nk-landing
          - site: 3dtisk
            project: nk-3dtisk
          - site: voziky
            project: nk-voziky
          - site: dodavky
            project: nk-dodavky
          - site: zkusebny
            project: nk-zkusebny
          - site: hospoda
            project: nk-hospoda
    concurrency: deploy-${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nk/${{ matrix.site }} build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy sites/${{ matrix.site }}/dist --project-name=${{ matrix.project }} --branch main
